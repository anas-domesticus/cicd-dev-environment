---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example
  namespace: argocd
  labels:
    app.kubernetes.io/name: example
spec:
  project: default
  source:
    repoURL: http://github.com/somerepo.git
    targetRevision: HEAD
    path: k8s/overlays/dev/example/
    kustomize:
      images:
        - example
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true